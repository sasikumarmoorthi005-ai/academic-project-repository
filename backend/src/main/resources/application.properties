server.port=8080
server.error.include-message=always

spring.datasource.url=jdbc:mysql://localhost:3306/projectvault?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# JWT secret must be at least 32 characters
app.jwt.secret=ProjectVaultSuperSecretKeyChangeMe1234567890
app.jwt.expiration-ms=86400000
app.upload-dir=uploads
app.cors.origin=http://localhost:5173

# Default admin account (created on first start)
app.admin.name=Administrator
app.admin.email=admin@projectvault.com
app.admin.password=admin123
